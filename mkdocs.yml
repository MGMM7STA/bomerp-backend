site_name: Semestre Saludable UPeU - Backend
site_description: Backend REST modular del proyecto Semestre Saludable UPeU - LP2 Unidad 1
site_author: Montalvo Machaca, Maykol Gabriel
repo_url: https://github.com/MGMM7STA/bomerp-backend
repo_name: MGMM7STA/bomerp-backend

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Inicio: index.md
  - Producto Unidad 1: proyecto-integrador/u1/lp2-demo.md
  - Guia de ejecucion: guia-ejecucion.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
