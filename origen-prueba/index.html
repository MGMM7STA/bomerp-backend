<!doctype html>
<html>
<head><meta charset="utf-8"><title>Origen de prueba 5500</title></head>
<body style="font-family:sans-serif;padding:2rem">
  <h2>Origen de prueba — http://localhost:5500</h2>
  <button onclick="probar()">Llamar a /api/v1/ventas</button>
  <pre id="salida" style="background:#eee;padding:1rem;margin-top:1rem"></pre>
  <script>
    function probar() {
      fetch("http://localhost:8080/api/v1/ventas")
        .then(r => r.json())
        .then(d => { document.getElementById("salida").textContent = JSON.stringify(d, null, 2); })
        .catch(e => { document.getElementById("salida").textContent = "FALLO: " + e; });
    }
  </script>
</body>
</html>
