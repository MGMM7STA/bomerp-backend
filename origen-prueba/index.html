<!doctype html>
<html>
<head><meta charset="utf-8"><title>Origen de prueba CORS</title></head>
<body style="font-family:sans-serif;padding:2rem">
  <h2>Prueba de CORS</h2>
  <p><b>Origen de esta pagina:</b> <span id="origen"></span></p>
  <p>Origenes permitidos por el backend: <code>http://localhost:4200</code> y <code>http://localhost:5500</code></p>

  <button onclick="probar('/api/v1/participacion/registros')">GET /api/v1/participacion/registros</button>
  <button onclick="probar('/api/v1/participacion/registros/resumen')">GET /api/v1/participacion/registros/resumen</button>
  <button onclick="probar('/api/v1/ventas')">GET /api/v1/ventas</button>

  <pre id="salida" style="background:#eee;padding:1rem;margin-top:1rem;white-space:pre-wrap"></pre>

  <script>
    document.getElementById("origen").textContent = window.location.origin;

    function probar(ruta) {
      const salida = document.getElementById("salida");
      salida.textContent = "Llamando a http://localhost:8080" + ruta + " desde " + window.location.origin + " ...";
      fetch("http://localhost:8080" + ruta)
        .then(r => r.json())
        .then(d => { salida.textContent = "OK (" + window.location.origin + ")\n\n" + JSON.stringify(d, null, 2); })
        .catch(e => { salida.textContent = "BLOQUEADO desde " + window.location.origin + "\n\n" + e + "\n\nAbre la consola (F12) para ver el error de CORS."; });
    }
  </script>
</body>
</html>
