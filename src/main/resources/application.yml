spring:
  application:
    name: bomerp-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

bomerp:
  evidencias:
    directorio: ${EVIDENCIAS_DIR:uploads/evidencias}
  cuentas:
    dominio-correo: ${CORREO_DOMINIO:upeu.edu.pe}
    cliente-web: saludable-frontend
    url-web: ${WEB_URL:http://localhost:4200/}
  odoo:
    url: ${ODOO_URL:}
    db: ${ODOO_DB:crm_premios}
    login: ${ODOO_LOGIN:}
    api-key: ${ODOO_API_KEY:}
    programa-puntos: Puntos Saludables
  keycloak:
    admin:
      url: ${KEYCLOAK_ADMIN_URL:http://localhost:38080}
      realm: saludable
      client-id: saludable-backend
      client-secret: ${KEYCLOAK_BACKEND_SECRET:saludable-backend-dev-2026}
