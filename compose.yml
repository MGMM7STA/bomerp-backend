name: bomerp-backend-prod

services:
  oracle:
    image: gvenzl/oracle-free:23
    container_name: bomerp-oracle-prod
    restart: unless-stopped
    ports:
      - "41521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      TZ: America/Lima
    volumes:
      - oracle-data-prod:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  keycloak-db:
    image: postgres:17-alpine
    container_name: bomerp-keycloak-db-prod
    restart: unless-stopped
    ports:
      - "45432:5432"
    environment:
      POSTGRES_DB: bomerp_keycloak
      POSTGRES_USER: bomerp_keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bomerp_keycloak -d bomerp_keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: bomerp-keycloak-prod
    restart: unless-stopped
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "48080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/bomerp_keycloak
      KC_DB_USERNAME: bomerp_keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-data-prod:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes

  bomerp-backend:
    build: .
    container_name: bomerp-backend-prod
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
      keycloak-db:
        condition: service_healthy
    ports:
      - "48088:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: oracle
      DB_PORT: 1521
      DB_NAME: FREEPDB1
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ISSUER_URI: http://localhost:48080/realms/saludable
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/saludable/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: http://localhost:4300
      EVIDENCIAS_DIR: /app/uploads/evidencias
      ODOO_URL: ${ODOO_URL}
      ODOO_DB: ${ODOO_DB}
      ODOO_LOGIN: ${ODOO_LOGIN}
      ODOO_API_KEY: ${ODOO_API_KEY}
      WEB_URL: http://localhost:4300/
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_BACKEND_SECRET: ${KEYCLOAK_BACKEND_SECRET}
    volumes:
      - evidencias-prod:/app/uploads/evidencias

volumes:
  oracle-data-prod:
  keycloak-data-prod:
  keycloak-db-data-prod:
  evidencias-prod:
